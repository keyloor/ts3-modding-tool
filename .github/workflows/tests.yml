name: Tests

# Synthetic tests only: no game files and no models are needed (or allowed) in the repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q kit tools tests
      - run: python -I tests/test_mods.py
      - run: python -I tests/test_replacement.py
      - run: python -I tests/test_layers.py
      - run: python -I tests/test_layers.py --loader
      - run: python -I tests/test_adjust.py
      - run: python -I tests/test_model_errors.py
      - run: python -I tests/test_cli.py
      - run: python -I tests/test_cli.py --loader
      - run: python -I tests/test_loader.py
      - run: python -I tests/test_explorer.py
      - run: python -I tests/test_audio.py
      - run: python -I tests/test_gltf.py --artifacts build/gltf-checks
      - run: python -I tests/test_gltflib.py
      - run: python -I tests/test_identity.py
      - run: python -I tests/test_meshes.py
      - run: python -I tests/test_meshtopo.py
      - run: python -I tests/test_meshselect.py
      - run: npm.cmd install --prefix build/gltf-validator --no-save --ignore-scripts gltf-validator@2.0.0-dev.3.10
      - run: node tests/validate_gltf.cjs build/gltf-checks
      - run: python -I tests/test_textures.py
