name: Tests

# Synthetic tests only: no game files and no models are needed (or allowed) in the repository.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q kit tools tests
      - run: python -I tests/test_mods.py
      - run: python -I tests/test_adjust.py
      - run: python -I tests/test_cli.py
